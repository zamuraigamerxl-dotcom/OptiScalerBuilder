name: Build NR + XeFG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        repository: wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass
        ref: main
        path: .
        submodules: recursive

    - name: Download XeFGUnlock.h from Coldwood
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Coldwood1026/OptiScaler/master/OptiScaler/proxies/XeFGUnlock.h" -OutFile "OptiScaler\proxies\XeFGUnlock.h"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Coldwood1026/OptiScaler/master/OptiScaler/proxies/XeFGPacing.h" -OutFile "OptiScaler\proxies\XeFGPacing.h"

    - name: Patch XeFG_Proxy.h
      shell: pwsh
      run: |
        $f = "OptiScaler\proxies\XeFG_Proxy.h"
        $c = Get-Content $f -Raw
        $c = $c.Replace("#pragma once", "#pragma once`n#include ""XeFGUnlock.h""")
        $c = $c.Replace("_dll = libxefgModule", "_dll = libxefgModule;`n    if (_dll) XeFGUnlock::Apply(_dll)")
        Set-Content $f $c -NoNewline

    - name: Patch Config.h
      shell: pwsh
      run: |
        $f = "OptiScaler\Config.h"
        $c = Get-Content $f -Raw
        $insert = "`npublic:`n    static constexpr int32_t XeFGMaxInterpolations = 7;`n    CustomOptional<bool> FGXeFGUnlockEnabled { true };`n    CustomOptional<int>  FGXeFGMaxInterpolatedFrames { XeFGMaxInterpolations };`n    CustomOptional<bool> FGXeFGExtraPacing { true };`n"
        $idx = $c.LastIndexOf("};")
        $c = $c.Substring(0, $idx) + $insert + $c.Substring($idx)
        Set-Content $f $c -NoNewline

    - name: Patch Config.cpp
      shell: pwsh
      run: |
        $f = "OptiScaler\Config.cpp"
        $c = Get-Content $f -Raw
        $insert = "`n        FGXeFGUnlockEnabled.set_from_config(readBool(""XeFG"", ""UnlockMFG""));`n        FGXeFGMaxInterpolatedFrames.set_from_config(readInt(""XeFG"", ""MaxInterpolatedFrames""));`n        FGXeFGExtraPacing.set_from_config(readBool(""XeFG"", ""ExtraPacing""));`n"
        $idx = $c.LastIndexOf("readBool")
        $end = $c.IndexOf("`n", $idx)
        $end = $c.IndexOf("`n", $end + 1)
        $c = $c.Substring(0, $end + 1) + $insert + $c.Substring($end + 1)
        Set-Content $f $c -NoNewline

    - name: Patch vcxproj
      shell: pwsh
      run: |
        $f = "OptiScaler\OptiScaler.vcxproj"
        $c = Get-Content $f -Raw
        $c = $c.Replace("</ItemGroup>", '    <ClInclude Include="proxies\XeFGUnlock.h" />' + "`n" + '    <ClInclude Include="proxies\XeFGPacing.h" />' + "`n  </ItemGroup>")
        Set-Content $f $c -NoNewline

    - uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild /m /p:Configuration=Release . /verbosity:minimal

    - name: Package
      shell: pwsh
      run: |
        $dest = "x64\Release\a\OptiScaler"
        New-Item -ItemType Directory -Path "$dest\streamline" -Force | Out-Null
        New-Item -ItemType Directory -Path "$dest\plugins" -Force | Out-Null
        # Intel XeSS DLLs
        $release = Invoke-RestMethod "https://api.github.com/repos/intel/xess/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xess.zip"
        Expand-Archive "xess.zip" -DestinationPath "xess" -Force
        $fg = Get-ChildItem "xess" -Recurse -Filter "libxess_fg.dll" | Select-Object -First 1
        $xell = Get-ChildItem "xess" -Recurse -Filter "libxell.dll" | Select-Object -First 1
        if ($fg) { Copy-Item $fg.FullName $dest -Force }
        if ($xell) { Copy-Item $xell.FullName $dest -Force }
        # INI
        $ini = "x64\Release\a\OptiScaler.ini"
        Add-Content $ini "`n[DlssNr]`nEnabled=true`nRunBeforeSR=true`nPasses=1`nWorkingScale=0.7`n[FrameGen]`nFGOutput=xefg`n[XeFG]`nUnlockMFG=true`nInterpolationCount=2"
        # Zip
        7z a -r "release.7z" "x64\Release\a\*"

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: OptiScaler-NR-XeFG
        path: release.7z

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: NR-XeFG-${{ github.run_number }}
        files: release.7z
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
