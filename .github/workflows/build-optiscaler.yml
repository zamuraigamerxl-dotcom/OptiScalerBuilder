name: Build OptiScaler DLSS-NR + XeFG (Combined)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - name: Checkout wilsjo2 fork (DLSS-NR PreSR Multipass)
      uses: actions/checkout@v6
      with:
        repository: wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass
        ref: main
        path: .
        submodules: recursive

    - name: OptiScaler - Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }

        function Get-Version-Component {
            param ([string]$pattern, [string]$replacement)
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) { return ($line.Line -replace $replacement).Trim() }
            else { Write-Error "Pattern not found: $pattern"; exit 1 }
        }

        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'

        $resourceContent = Get-Content $resourceFile -Raw

        if ($resourceContent -match '(?m)^\s*#define\s+VER_DEV_RELEASE\s*$') {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion-dev"
        }
        elseif ($resourceContent -match '(?m)^\s*#define\s+VER_PRE_RELEASE\s*$') {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        }
        else {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion"
        }

        $date = Get-Date -Format "yyyyMMdd_HHmmss"
        $sha = git rev-parse --short=8 HEAD
        $outputFileName = "OptiScaler_DLSSNR_XeFG_${version}_${sha}_${date}"

        Write-Output "Generated Filename: $outputFileName"
        Write-Output "OptiScaler SHA: $sha"

        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      continue-on-error: false

    - name: OptiScaler - Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: OptiScaler - Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal

    - name: Customize output folders
      shell: powershell
      run: |
        @(
          "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins",
          "${{ github.workspace }}\x64\Release\a\OptiScaler\streamline"
        ) | ForEach-Object {
          New-Item -ItemType Directory -Path $_ -Force | Out-Null
        }

        @(
          "${{ github.workspace }}\x64\Release\a\Licenses",
          "${{ github.workspace }}\x64\Release\a\!! EXTRACT ALL FILES TO GAME FOLDER !!",
          "${{ github.workspace }}\x64\Release\a\setup_linux.sh",
          "${{ github.workspace }}\x64\Release\a\setup_windows.bat"
        ) | ForEach-Object {
          if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
        }

    - name: Download Latest fakenvapi
      id: fakenvapi
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/fakenvapi/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "\.7z$" } | Select-Object -First 1
        if (-not $asset) { throw "No fakenvapi.7z asset found." }
        $out = "${{ github.workspace }}\fakenvapi.7z"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        7z x $out "-o${{ github.workspace }}\\x64\Release\a\OptiScaler" -y

    - name: Download Latest OptiPatcher
      id: optipatcher
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/OptiPatcher/releases/tags/rolling"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "\.asi$" } | Select-Object -First 1
        if (-not $asset) { throw "No OptiPatcher.asi asset found." }
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins\OptiPatcher.asi"

    - name: Download Latest NVIDIA Streamline SDK
      id: streamline
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/NVIDIA-RTX/Streamline/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "^streamline-sdk-v[0-9.]+\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "No streamline-sdk zip found." }
        $out = "${{ github.workspace }}\streamline-sdk.zip"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        Expand-Archive $out -DestinationPath "${{ github.workspace }}\streamline-sdk" -Force
        Get-ChildItem "${{ github.workspace }}\streamline-sdk\bin\x64" -File -Filter "*.dll" |
        ForEach-Object { Copy-Item $_.FullName "${{ github.workspace }}\x64\Release\a\OptiScaler\streamline" -Force }

    - name: Download Latest DLSS Enabler
      id: dlssenabler
      shell: powershell
      run: |
        $Files = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/contents/dlss-enabler"
        $Versions = $Files |
            Where-Object { $_.name -like "*.zip" } |
            ForEach-Object {
                if ($_.name -match 'DLSS Enabler (\d+(?:\.\d+){2,3})') {
                    [PSCustomObject]@{ Version = [version]$Matches[1]; File = $_.name; Url = $_.download_url }
                }
            } | Sort-Object Version -Descending
        $LatestFile = $Versions | Select-Object -First 1
        "version=$($LatestFile.Version)" >> $env:GITHUB_OUTPUT
        Invoke-WebRequest -Uri $LatestFile.Url -OutFile "${{ github.workspace }}\dlss-enabler.zip"
        Expand-Archive -Path "${{ github.workspace }}\dlss-enabler.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force
        Rename-Item -Path "${{ github.workspace }}\x64\Release\a\OptiScaler\version.dll" -NewName "dlss-enabler-headless.dll"

    - name: Download Latest dlssg_to_fsr3
      id: dlssg_to_fsr3
      shell: powershell
      run: |
        $dlssg_to_fsr3_version = "v0.130"
        "version=$dlssg_to_fsr3_version" >> $env:GITHUB_OUTPUT
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/bygalacos/OptiScalerBuilder/master/dlssg_to_fsr3/dlssg_to_fsr3_amd_is_better.zip" -OutFile "${{ github.workspace }}\dlssg_to_fsr3.zip"
        Expand-Archive -Path "${{ github.workspace }}\dlssg_to_fsr3.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force

    - name: Pre-configure OptiScaler.ini for max performance pipeline
      shell: powershell
      run: |
        $iniPath = "${{ github.workspace }}\x64\Release\a\OptiScaler.ini"
        $iniContent = @"
        ; ============================================================
        ; OptiScaler - DLSS-NR PreSR + XeFG Combined Build
        ; Pipeline: Game render (low res) -> NR (cheap, small image)
        ;           -> Upscaler (SR) -> Frame Generation
        ; NR runs BEFORE upscaler AND before frame generation
        ; for maximum performance (NR processes the small pre-SR image)
        ; ============================================================

        [ProcessFilter]
        TargetProcessName=auto

        [DlssNr]
        ; DLSS Neural Rendering - runs BEFORE Super Resolution
        Enabled=true
        RunBeforeSR=true
        Passes=1
        WorkingScale=1.0

        [FrameGen]
        ; Frame Generation - runs AFTER upscaler (NR already ran before)
        ; FGOutput options: xefg (Intel FG, all GPUs), fsrfg, dlssg, fsr4fg
        External=false
        Enabled=false
        FGInput=upscaler
        FGOutput=xefg
        FGNvngxReplacement=None

        [DLSSG]
        ; InterpolationCount: 1=2x, 2=3x, 3=4x total frames
        InterpolationCount=1
        ForceDMFG=false

        [Log]
        LogToFile=true
        LogLevel=2
        "@

        Set-Content -Path $iniPath -Value $iniContent -Encoding UTF8
        Write-Host "OptiScaler.ini pre-configured with NR-before-SR pipeline"

        $readmePath = "${{ github.workspace }}\x64\Release\a\PIPELINE-README.txt"
        $readmeContent = @"
        ============================================================
        DLSS-NR + XeFG COMBINED BUILD - PIPELINE ORDER
        ============================================================

        This build runs Neural Rendering BEFORE upscaling and before
        frame generation, for maximum performance:

          1. Game renders at low resolution (e.g. 1080p for 4K target)
          2. DLSS Neural Rendering processes the SMALL image (cheap!)
             -> RunBeforeSR=true, WorkingScale=1.0
          3. Upscaler (DLSS/FSR/XeSS) upscales to target resolution
          4. Frame Generation interpolates between upscaled frames
             -> FGOutput=xefg (Intel FG, works on ALL GPUs)

        WHY THIS IS FASTER:
        NR runs on the pre-upscale image (e.g. 1080p) instead of the
        full 4K output. The model does ~4x less work.

        TO ENABLE FRAME GENERATION:
        In the Insert overlay or OptiScaler.ini, set:
          [FrameGen]
          Enabled=true
          FGOutput=xefg        ; Intel FG for all GPUs
          ; or fsrfg / dlssg / fsr4fg

        TO ADJUST NR MULTIPLIER / PASSES:
        In the Insert overlay under "DLSS Neural Rendering":
          - Passes: 1 (fastest) to 3 (highest quality)
          - WorkingScale: 1.0 (full pre-SR res) or 0.5 (even cheaper)

        FG MULTIPLIER (InterpolationCount):
          1 = 2x total frames
          2 = 3x total frames
          3 = 4x total frames
        "@

        Set-Content -Path $readmePath -Value $readmeContent -Encoding UTF8
        Write-Host "PIPELINE-README.txt written"

    - name: Compress the artifact
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r "${{ github.workspace }}\$zipName" "${{ github.workspace }}\x64\Release\a\*"
      continue-on-error: false

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.filename }}
        name: ${{ steps.get_version.outputs.filename }}
        body: |
          ## Combined Build: DLSS-NR PreSR + XeFG (Intel FG) for all GPUs

          Built from: `wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass` (main)

          | Component | Version |
          |-----------|---------|
          | OptiScaler (DLSS-NR fork) | ${{ steps.get_version.outputs.version }} - SHA: ${{ steps.get_version.outputs.sha }} |
          | fakenvapi | ${{ steps.fakenvapi.outputs.version }} |
          | OptiPatcher | ${{ steps.optipatcher.outputs.version }} |
          | NVIDIA Streamline SDK | ${{ steps.streamline.outputs.version }} |
          | DLSS Enabler | ${{ steps.dlssenabler.outputs.version }} |
          | dlssg_to_fsr3 | ${{ steps.dlssg_to_fsr3.outputs.version }} |

          ### Pipeline order (max performance)
          ```
          Game (low res) -> DLSS-NR (small image, cheap) -> Upscaler SR -> Frame Gen
          ```
          NR runs BEFORE upscaler AND before frame generation.
          Pre-configured in OptiScaler.ini (RunBeforeSR=true).

          ### Features in this build
          - DLSS Neural Rendering BEFORE Super Resolution (PreSR multipass)
          - XeFG (Intel Frame Generation) for ALL GPUs via OptiFG
          - FSR3-FG, FSR4-FG, DLSSG support
          - FG multiplier: 2x/3x/4x (InterpolationCount 1/2/3)
          - All standard OptiScaler upscaler features

          ### Quick start
          1. Extract beside game .exe
          2. Run setup_windows.bat
          3. Press Insert in-game -> enable NR + FG
          4. See PIPELINE-README.txt for full config
        files: |
          ${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z
        prerelease: false
        make_latest: true
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
