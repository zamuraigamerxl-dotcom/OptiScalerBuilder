name: Build OptiScaler DLSS-NR + XeFG (Combined)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - name: Checkout Coldwood1026 (XeFG unlock base)
      uses: actions/checkout@v6
      with:
        repository: Coldwood1026/OptiScaler
        ref: master
        path: .
        submodules: recursive
        fetch-depth: 0

    - name: Merge Neural Render from wilsjo2
      shell: bash
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git remote add wilsjo2 https://github.com/wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass.git
        git fetch wilsjo2 main --depth=100
        echo "Merging wilsjo2 NR with -X ours (keep Coldwood code, add NR files from wilsjo2)..."
        git merge wilsjo2/main --no-edit -X ours --allow-unrelated-histories
        echo "Merge complete."
        # Verify NR files were added
        if [ -d "OptiScaler/dlssnr" ]; then
          echo "OK: dlssnr/ directory present"
          ls OptiScaler/dlssnr/*.h OptiScaler/dlssnr/*.cpp 2>/dev/null | head -10
        else
          echo "WARNING: dlssnr/ directory not found!"
        fi
        git log --oneline -3

    - name: Patch menu_common.cpp - Add Ajustes Finos section
      shell: python
      run: |
        file_path = "OptiScaler/menu/menu_common.cpp"
        with open(file_path, "r", encoding="utf-8") as f:
            content = f.read()

        old_start = 'ImGui::SeparatorText("Upscale Ratio Override");'
        old_end = 'if (config->QualityRatioOverrideEnabled.value_or_default())'

        start_idx = content.index(old_start)
        end_idx = content.index(old_end, start_idx)

        new_code = '''        // ============================================================
        // AJUSTES FINOS - 3 sliders
        // ============================================================
        ImGui::SeparatorText("Ajustes Finos");

        // --- 1. Resolution Scale (30% a 100%) ---
        {
            float ratio = config->UpscaleRatioOverrideValue.value_or_default();
            float pct = (1.0f / ratio) * 100.0f;
            if (pct < 30.0f) pct = 30.0f;
            if (pct > 100.0f) pct = 100.0f;

            bool isOverridden = config->UpscaleRatioOverrideEnabled.value_or_default();

            if (!isOverridden)
                ImGui::BeginDisabled();

            if (ImGui::SliderFloat("Resolution Scale", &pct, 30.0f, 100.0f, "%.0f%%"))
            {
                if (!isOverridden)
                {
                    config->UpscaleRatioOverrideEnabled = true;
                    config->QualityRatioOverrideEnabled = false;
                    isOverridden = true;
                }
                ratio = 100.0f / pct;
                config->UpscaleRatioOverrideValue = ratio;
            }

            if (!isOverridden)
                ImGui::EndDisabled();

            ShowHelpMarker("Internal resolution as %% of target\\n\\n"
                           "50%% on 4K = 1920x1080 internal\\n"
                           "100%% = native (no upscaling)\\n"
                           "Overrides the game's quality preset");

            if (currentFeature != nullptr)
            {
                uint32_t targetW = currentFeature->TargetWidth();
                uint32_t targetH = currentFeature->TargetHeight();
                uint32_t renderW = static_cast<uint32_t>(targetW / ratio);
                uint32_t renderH = static_cast<uint32_t>(targetH / ratio);
                ImGui::TextDisabled("Internal: %ux%u -> Output: %ux%u", renderW, renderH, targetW, targetH);
            }

            ImGui::SameLine();
            if (ImGui::Checkbox("Override##res", &isOverridden))
            {
                config->UpscaleRatioOverrideEnabled = isOverridden;
                if (isOverridden)
                    config->QualityRatioOverrideEnabled = false;
            }
        }

        ImGui::Spacing();

        // --- 2. Nitidez / Enfoque (0.0 a 1.3) ---
        {
            bool rcasOn = config->RcasEnabled.value_or(rcasEnabled);

            if (!rcasOn)
                ImGui::BeginDisabled();

            float sharpness = config->Sharpness.value_or_default();

            if (ImGui::SliderFloat("Nitidez", &sharpness, 0.0f, 1.3f, "%.2f"))
            {
                if (!rcasOn)
                {
                    config->RcasEnabled = true;
                    config->OverrideSharpness = true;
                    rcasOn = true;
                }
                config->Sharpness = sharpness;
                config->OverrideSharpness = true;
            }

            if (!rcasOn)
                ImGui::EndDisabled();

            ShowHelpMarker("Sharpening post-upscale (RCAS)\\n\\n"
                           "0.0 = sin sharpening\\n"
                           "0.3 = suave (recomendado)\\n"
                           "1.0 = agresivo\\n"
                           "1.3 = maximo");

            ImGui::SameLine();
            if (ImGui::Checkbox("Enable##sharp", &rcasOn))
            {
                config->RcasEnabled = rcasOn;
                if (rcasOn)
                    config->OverrideSharpness = true;
            }
        }

        ImGui::Spacing();

        // --- 3. Intensidad de color (0.0 a 2.0) ---
        {
            bool contrastOn = config->ContrastEnabled.value_or_default();

            if (!contrastOn)
                ImGui::BeginDisabled();

            float contrast = config->Contrast.value_or_default();
            float intensityPct = (contrast + 2.0f) / 4.0f * 2.0f;

            if (ImGui::SliderFloat("Intensidad", &intensityPct, 0.0f, 2.0f, "%.2f"))
            {
                if (!contrastOn)
                {
                    config->ContrastEnabled = true;
                    contrastOn = true;
                }
                contrast = (intensityPct / 2.0f) * 4.0f - 2.0f;
                config->Contrast = contrast;
            }

            if (!contrastOn)
                ImGui::EndDisabled();

            ShowHelpMarker("Intensidad de color / contraste\\n\\n"
                           "0.0 = menos intenso\\n"
                           "1.0 = normal\\n"
                           "2.0 = mas intenso");

            ImGui::SameLine();
            if (ImGui::Checkbox("Enable##color", &contrastOn))
                config->ContrastEnabled = contrastOn;
        }

        '''

        content = content[:start_idx] + new_code + "\n        " + content[end_idx:]

        with open(file_path, "w", encoding="utf-8") as f:
            f.write(content)

        print(f"Patched menu_common.cpp: replaced {end_idx - start_idx} chars with {len(new_code)} chars")

    - name: OptiScaler - Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }

        function Get-Version-Component {
            param ([string]$pattern, [string]$replacement)
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) { return ($line.Line -replace $replacement).Trim() }
            else { Write-Error "Pattern not found: $pattern"; exit 1 }
        }

        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'

        $resourceContent = Get-Content $resourceFile -Raw

        if ($resourceContent -match '(?m)^\s*#define\s+VER_DEV_RELEASE\s*$') {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion-dev"
        }
        elseif ($resourceContent -match '(?m)^\s*#define\s+VER_PRE_RELEASE\s*$') {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        }
        else {
            $version = "v$majorVersion.$minorVersion.$hotfixVersion"
        }

        $date = Get-Date -Format "yyyyMMdd_HHmmss"
        $sha = git rev-parse --short=8 HEAD
        $outputFileName = "OptiScaler_DLSSNR_XeFG_${version}_${sha}_${date}"

        Write-Output "Generated Filename: $outputFileName"
        Write-Output "OptiScaler SHA: $sha"

        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      continue-on-error: false

    - name: OptiScaler - Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: OptiScaler - Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal

    - name: Customize output folders
      shell: powershell
      run: |
        @(
          "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins",
          "${{ github.workspace }}\x64\Release\a\OptiScaler\streamline"
        ) | ForEach-Object {
          New-Item -ItemType Directory -Path $_ -Force | Out-Null
        }

        @(
          "${{ github.workspace }}\x64\Release\a\Licenses",
          "${{ github.workspace }}\x64\Release\a\!! EXTRACT ALL FILES TO GAME FOLDER !!",
          "${{ github.workspace }}\x64\Release\a\setup_linux.sh"
        ) | ForEach-Object {
          if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
        }

    - name: Download Latest fakenvapi
      id: fakenvapi
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/fakenvapi/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "\.7z$" } | Select-Object -First 1
        if (-not $asset) { throw "No fakenvapi.7z asset found." }
        $out = "${{ github.workspace }}\fakenvapi.7z"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        7z x $out "-o${{ github.workspace }}\\x64\Release\a\OptiScaler" -y

    - name: Download Latest OptiPatcher
      id: optipatcher
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/OptiPatcher/releases/tags/rolling"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "\.asi$" } | Select-Object -First 1
        if (-not $asset) { throw "No OptiPatcher.asi asset found." }
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins\OptiPatcher.asi"

    - name: Download Latest NVIDIA Streamline SDK
      id: streamline
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/NVIDIA-RTX/Streamline/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        $asset = $release.assets | Where-Object { $_.name -match "^streamline-sdk-v[0-9.]+\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "No streamline-sdk zip found." }
        $out = "${{ github.workspace }}\streamline-sdk.zip"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        Expand-Archive $out -DestinationPath "${{ github.workspace }}\streamline-sdk" -Force
        Get-ChildItem "${{ github.workspace }}\streamline-sdk\bin\x64" -File -Filter "*.dll" |
        ForEach-Object { Copy-Item $_.FullName "${{ github.workspace }}\x64\Release\a\OptiScaler\streamline" -Force }

    - name: Download Latest DLSS Enabler
      id: dlssenabler
      shell: powershell
      run: |
        $Files = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/contents/dlss-enabler"
        $Versions = $Files |
            Where-Object { $_.name -like "*.zip" } |
            ForEach-Object {
                if ($_.name -match 'DLSS Enabler (\d+(?:\.\d+){2,3})') {
                    [PSCustomObject]@{ Version = [version]$Matches[1]; File = $_.name; Url = $_.download_url }
                }
            } | Sort-Object Version -Descending
        $LatestFile = $Versions | Select-Object -First 1
        "version=$($LatestFile.Version)" >> $env:GITHUB_OUTPUT
        Invoke-WebRequest -Uri $LatestFile.Url -OutFile "${{ github.workspace }}\dlss-enabler.zip"
        Expand-Archive -Path "${{ github.workspace }}\dlss-enabler.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force
        Rename-Item -Path "${{ github.workspace }}\x64\Release\a\OptiScaler\version.dll" -NewName "dlss-enabler-headless.dll"

    - name: Download Latest dlssg_to_fsr3
      id: dlssg_to_fsr3
      shell: powershell
      run: |
        $dlssg_to_fsr3_version = "v0.130"
        "version=$dlssg_to_fsr3_version" >> $env:GITHUB_OUTPUT
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/bygalacos/OptiScalerBuilder/master/dlssg_to_fsr3/dlssg_to_fsr3_amd_is_better.zip" -OutFile "${{ github.workspace }}\dlssg_to_fsr3.zip"
        Expand-Archive -Path "${{ github.workspace }}\dlssg_to_fsr3.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force

    - name: Download Intel XeSS SDK (libxess_fg.dll + libxell.dll)
      id: xess
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/intel/xess/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        Write-Host "Intel XeSS SDK version: $($release.tag_name)"
        $asset = $release.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1
        if (-not $asset) { throw "No XeSS SDK zip found." }
        $out = "${{ github.workspace }}\xess-sdk.zip"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        Expand-Archive $out -DestinationPath "${{ github.workspace }}\xess-sdk" -Force
        # Copy libxess_fg.dll and libxell.dll to the output
        $dest = "${{ github.workspace }}\x64\Release\a\OptiScaler"
        $fgDll = Get-ChildItem "${{ github.workspace }}\xess-sdk" -Recurse -Filter "libxess_fg.dll" | Select-Object -First 1
        $xellDll = Get-ChildItem "${{ github.workspace }}\xess-sdk" -Recurse -Filter "libxell.dll" | Select-Object -First 1
        if ($fgDll) { Copy-Item $fgDll.FullName $dest -Force; Write-Host "Copied libxess_fg.dll" }
        else { Write-Host "WARNING: libxess_fg.dll not found in SDK" }
        if ($xellDll) { Copy-Item $xellDll.FullName $dest -Force; Write-Host "Copied libxell.dll" }
        else { Write-Host "WARNING: libxell.dll not found in SDK" }

    - name: Pre-configure OptiScaler.ini for max performance pipeline
      shell: powershell
      run: |
        $iniPath = "${{ github.workspace }}\x64\Release\a\OptiScaler.ini"

        # Keep the original OptiScaler.ini from the build (has all defaults)
        # and append our NR + FG overrides at the end
        $nrConfig = @"

        ; ============================================================
        ; DLSS-NR + XeFG MFG Unlock Combined Build
        ; Pipeline: Game render -> NR (cheap) -> SR -> XeFG x3
        ; NR before upscaler, XeFG unlocked for all GPUs
        ; ============================================================

        [DlssNr]
        Enabled=true
        RunBeforeSR=true
        Passes=1
        WorkingScale=0.7

        [FrameGen]
        External=false
        Enabled=false
        FGInput=upscaler
        FGOutput=xefg
        FGNvngxReplacement=None

        [XeFG]
        UnlockMFG=true
        MaxInterpolatedFrames=7
        ExtraPacing=true
        InterpolationCount=2

        [Log]
        LogToFile=true
        LogLevel=2
        "@

        if (Test-Path $iniPath) {
          Add-Content -Path $iniPath -Value $nrConfig -Encoding UTF8
          Write-Host "Merged NR+FG settings into existing OptiScaler.ini"
        } else {
          Set-Content -Path $iniPath -Value $nrConfig -Encoding UTF8
          Write-Host "Created OptiScaler.ini with NR+FG settings"
        }

        $readmePath = "${{ github.workspace }}\x64\Release\a\PIPELINE-README.txt"
        $readmeContent = @"
        ============================================================
        DLSS-NR + XeFG COMBINED BUILD - PIPELINE ORDER
        ============================================================

        This build runs Neural Rendering BEFORE upscaling and before
        frame generation, for maximum performance:

          1. Game renders at low resolution (e.g. 1080p for 4K target)
          2. DLSS Neural Rendering processes the SMALL image (cheap!)
             -> RunBeforeSR=true, WorkingScale=1.0
          3. Upscaler (DLSS/FSR/XeSS) upscales to target resolution
          4. Frame Generation interpolates between upscaled frames
             -> FGOutput=xefg (Intel FG, works on ALL GPUs)

        WHY THIS IS FASTER:
        NR runs on the pre-upscale image (e.g. 1080p) instead of the
        full 4K output. The model does ~4x less work.

        TO ENABLE FRAME GENERATION:
        In the Insert overlay or OptiScaler.ini, set:
          [FrameGen]
          Enabled=true
          FGOutput=xefg        ; Intel FG for all GPUs
          ; or fsrfg / dlssg / fsr4fg

        TO ADJUST NR MULTIPLIER / PASSES:
        In the Insert overlay under "DLSS Neural Rendering":
          - Passes: 1 (fastest) to 3 (highest quality)
          - WorkingScale: 1.0 (full pre-SR res) or 0.5 (even cheaper)

        FG MULTIPLIER (InterpolationCount):
          1 = 2x total frames
          2 = 3x total frames
          3 = 4x total frames
        "@

        Set-Content -Path $readmePath -Value $readmeContent -Encoding UTF8
        Write-Host "PIPELINE-README.txt written"

    - name: Compress the artifact
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r "${{ github.workspace }}\$zipName" "${{ github.workspace }}\x64\Release\a\*"
      continue-on-error: false

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.filename }}
        name: ${{ steps.get_version.outputs.filename }}
        body: |
          ## Combined Build: DLSS-NR + XeFG MFG Unlock (all GPUs)

          Merges `wilsjo2` (Neural Render) + `Coldwood1026` (XeFG unlock) + Ajustes Finos GUI

          | Component | Version |
          |-----------|---------|
          | OptiScaler (NR + XeFG unlock) | ${{ steps.get_version.outputs.version }} - SHA: ${{ steps.get_version.outputs.sha }} |
          | fakenvapi | ${{ steps.fakenvapi.outputs.version }} |
          | OptiPatcher | ${{ steps.optipatcher.outputs.version }} |
          | NVIDIA Streamline SDK | ${{ steps.streamline.outputs.version }} |
          | DLSS Enabler | ${{ steps.dlssenabler.outputs.version }} |
          | dlssg_to_fsr3 | ${{ steps.dlssg_to_fsr3.outputs.version }} |
          | Intel XeSS SDK | ${{ steps.xess.outputs.version }} |

          ### Features
          - DLSS Neural Rendering BEFORE upscaler (RunBeforeSR=true)
          - XeFG (Intel FG) UNLOCKED for all GPUs via Coldwood1026 patch
          - XeFG MFG up to 8x (MaxInterpolatedFrames=7)
          - Ajustes Finos: Resolution Scale + Nitidez + Intensidad sliders
          - libxess_fg.dll + libxell.dll included

          ### Pipeline
          ```
          Game -> NR (756p, cheap) -> SR -> XeFG x3 -> Output
          ```

          ### Features in this build
          - DLSS Neural Rendering BEFORE Super Resolution (PreSR multipass)
          - XeFG (Intel Frame Generation) for ALL GPUs via OptiFG
          - FSR3-FG, FSR4-FG, DLSSG support
          - FG multiplier: 2x/3x/4x (InterpolationCount 1/2/3)
          - All standard OptiScaler upscaler features

          ### Quick start
          1. Extract beside game .exe
          2. Run setup_windows.bat
          3. Press Insert in-game -> enable NR + FG
          4. See PIPELINE-README.txt for full config
        files: |
          ${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z
        prerelease: false
        make_latest: true
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
